name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo, so ask for nothing. A workflow that cannot push cannot be
# turned into one that does by a compromised action.
permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      # Actions are pinned to a commit SHA, not a tag. A tag is a moving pointer the action's
      # owner can repoint at any time, so `@v7` is a standing agreement to run whatever they
      # publish next; a SHA is not repointable. The trailing comment carries the human-readable
      # version, and dependabot (.github/dependabot.yml) rewrites both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Build the same pyenv/ venv the Makefile and local development use, so CI runs the
      # exact same commands a developer runs.
      #
      # --upgrade-deps matters: a venv is seeded with whatever pip its interpreter bundles in
      # ensurepip, which for the older matrix entries is old enough that pip-audit fails the
      # security gate on the seed itself (3.11 seeds pip 24.0 and setuptools 79.0.1, 3.12 seeds
      # pip 25.0.1). That is CI's own scaffolding, not anything setlistkit declares, but the
      # gate cannot tell the difference. Pull the seed from PyPI instead of from the tarball.
      - name: Bootstrap venv
        run: |
          python -m venv --upgrade-deps pyenv
          make dev

      - name: Lint, test, security
        run: make check

  # Once the whole matrix is green on main, tell moe-pack to re-lint itself against this exact
  # commit. moe-pack pins to setlistkit's default branch, so a rule that lands here should prove
  # itself against the pack the day it lands -- this is the nudge that makes that automatic
  # instead of waiting for the next unrelated push over there.
  notify-moe-pack:
    needs: check
    runs-on: ubuntu-latest
    # Never from a pull request or a branch push: a PR's checks passing says nothing about main,
    # and re-linting the pack against an unmerged commit would be noise. Only the real main push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # The built-in GITHUB_TOKEN is scoped to THIS repo and cannot dispatch to another, so this
      # uses a fine-grained PAT (secret MOE_PACK_DISPATCH_TOKEN) scoped to only setlistkit/moe-pack
      # with Contents:write -- the one permission the dispatch endpoint requires. The commit SHA
      # rides along as client_payload purely so moe-pack's run page can name what woke it; moe-pack
      # never feeds it to a shell, which is what keeps an injected payload field harmless.
      - name: Dispatch to moe-pack
        env:
          GH_TOKEN: ${{ secrets.MOE_PACK_DISPATCH_TOKEN }}
        run: |
          gh api --method POST /repos/setlistkit/moe-pack/dispatches \
            -f event_type=setlistkit-updated \
            -f 'client_payload[setlistkit_sha]=${{ github.sha }}'
