<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="setlistkit — SLK avatar">
  <title>setlistkit — SLK avatar</title>
  <!-- baked paper body; the left/right margins stay transparent so the tile shows through -->
  <rect x="35" y="8" width="130" height="184" fill="#F3EEE4"/>
  <g font-family="ui-monospace,Menlo,monospace">
    <!-- banded body -->
    <rect x="35" y="74"  width="130" height="39" fill="#1B1714" fill-opacity="0.14"/>
    <rect x="35" y="113" width="130" height="39" fill="#1B1714" fill-opacity="0.05"/>
    <rect x="35" y="152" width="130" height="40" fill="#1B1714" fill-opacity="0.14"/>
    <g fill="#1B1714" text-anchor="middle" letter-spacing="0.3">
      <text x="100" y="98"  font-size="11" font-weight="700">SLK-0420</text>
      <text x="100" y="137" font-size="10">SEC 420 · ROW G</text>
      <text x="100" y="176" font-size="11" font-weight="700">ADMIT ONE</text>
    </g>
  </g>
  <!-- SLK billboard, knocked out of a solid ink panel -->
  <mask id="slkBillboard">
    <rect x="35" y="8" width="130" height="60" fill="#fff"/>
    <text x="100" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
          font-weight="800" font-size="36" letter-spacing="-2.5" fill="#000">SLK</text>
  </mask>
  <rect x="35" y="8" width="130" height="60" fill="#1B1714" mask="url(#slkBillboard)"/>
  <!-- perforation -->
  <line x1="37" y1="71" x2="163" y2="71" stroke="#1B1714" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="3 4"/>
  <!-- outer edge -->
  <rect x="35" y="8" width="130" height="184" fill="none" stroke="#1B1714" stroke-width="3"/>
</svg>
