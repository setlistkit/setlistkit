<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="350" height="200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="setlistkit — SLK ticket banner">
  <title>setlistkit — SLK ticket banner</title>
  <!-- ticket paper -->
  <rect width="350" height="200" fill="#F3EEE4"/>
  <!-- top meta strip tint -->
  <rect x="0" y="0" width="350" height="52" fill="#1B1714" fill-opacity="0.08"/>
  <!-- left stub column: alternating field bands -->
  <rect x="0" y="52"    width="82" height="24.7" fill="#1B1714" fill-opacity="0.14"/>
  <rect x="0" y="76.7"  width="82" height="24.7" fill="#1B1714" fill-opacity="0.05"/>
  <rect x="0" y="101.4" width="82" height="24.6" fill="#1B1714" fill-opacity="0.14"/>
  <rect x="0" y="126"   width="82" height="24.7" fill="#1B1714" fill-opacity="0.05"/>
  <rect x="0" y="150.7" width="82" height="24.6" fill="#1B1714" fill-opacity="0.14"/>
  <rect x="0" y="175.3" width="82" height="24.7" fill="#1B1714" fill-opacity="0.05"/>
  <g font-family="ui-monospace,Menlo,monospace" fill="#1B1714">
    <!-- top meta strip -->
    <g font-size="8" fill-opacity="0.82" letter-spacing="0.2">
      <text x="8"   y="20">KB0420</text><text x="112" y="20">SEC 420</text>
      <text x="190" y="20">ROW G</text><text x="248" y="20">SEAT 11</text>
      <text x="342" y="20" text-anchor="end">ADULT</text>
      <text x="8"   y="40">UPPER LEVEL</text><text x="130" y="40">GENERAL ADMISSION</text>
      <text x="342" y="40" text-anchor="end">ADM $4.20</text>
    </g>
    <!-- stub column labels -->
    <g fill-opacity="0.55" font-size="4.6" letter-spacing="0.3">
      <text x="7" y="61">EVENT CODE</text><text x="7" y="86">RUNTIME</text>
      <text x="7" y="110">SOURCE</text><text x="7" y="135">FORMAT</text>
      <text x="7" y="159">LICENSE</text><text x="7" y="184">PRICE</text>
    </g>
    <!-- stub column values -->
    <g font-size="9.5" font-weight="700" letter-spacing="0.2">
      <text x="7" y="72">SLK-0420</text><text x="7" y="97">PYTHON</text>
      <text x="7" y="121">ARCHIVE</text><text x="7" y="146">FLAC</text>
      <text x="7" y="170">AGPL-3.0</text><text x="7" y="195">$4.20</text>
    </g>
    <!-- billboard print -->
    <g text-anchor="middle" fill-opacity="0.5">
      <text x="216" y="72" font-size="7" letter-spacing="1.5">★ SETLISTKIT PRESENTS ★</text>
      <text x="216" y="175" font-size="8" letter-spacing="0.6">KNICKERBOCKER ARENA · ALBANY NY</text>
      <text x="216" y="188" font-size="6" fill-opacity="0.42" letter-spacing="0.3">ADMIT ONE · PYTHON · ARCHIVE.ORG · FLAC · AGPL-3.0 · NO REFUNDS</text>
    </g>
  </g>
  <!-- billboard headline -->
  <text x="216" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-weight="800" font-size="62" letter-spacing="-2.5" fill="#1B1714">SLK</text>
  <!-- billboard keyline -->
  <rect x="88" y="58" width="256" height="134" fill="none" stroke="#1B1714" stroke-width="1.4" stroke-opacity="0.75"/>
  <!-- perforation between stub and billboard -->
  <line x1="82" y1="52" x2="82" y2="200" stroke="#1B1714" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="2.5 3"/>
  <!-- sprocket holes on the tear edge -->
  <g fill="#1B1714" fill-opacity="0.4">
    <circle cx="4.5" cy="64" r="1.2"/><circle cx="4.5" cy="86" r="1.2"/><circle cx="4.5" cy="108" r="1.2"/>
    <circle cx="4.5" cy="130" r="1.2"/><circle cx="4.5" cy="152" r="1.2"/><circle cx="4.5" cy="174" r="1.2"/>
  </g>
  <!-- outer edge -->
  <rect x="1.25" y="1.25" width="347.5" height="197.5" fill="none" stroke="#1B1714" stroke-width="2.5"/>
</svg>
